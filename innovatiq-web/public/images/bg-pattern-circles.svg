    <circle cx="470" cy="100" r="1.5" />

    <circle cx="380" cy="130" r="1.5" />
    <circle cx="410" cy="130" r="1.5" />
    <circle cx="440" cy="130" r="1.5" />
    <circle cx="470" cy="130" r="1.5" />

    <circle cx="380" cy="160" r="1.5" />
